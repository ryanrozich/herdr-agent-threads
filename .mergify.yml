# Merge queue for main. A pull request enters
# only after someone adds the `queue` label or comments `@mergifyio queue` (or, for a
# pull request Catalyst opens for a ticket, Catalyst adds `queue:ready`: the last rule),
# and never while it carries a `hold` or `hold:preview` label.
#
# Every condition is written with no space around the operator (base=main). Mergify reads
# both spellings the same, but Catalyst's reader of this file takes only the compact one
# (test/titles.test.js keeps them so).

queue_rules:
  - name: main
    queue_conditions:
      - base=main
      - -draft
      - -conflict
      - check-success=check
      # An acceptance hold keeps a pull request out of the queue, whoever queues it (the
      # queue label, a command or any rule below), and takes it out if it is already queued:
      # a pull request that stops meeting these conditions leaves the queue.
      - label!=hold
      - label!=hold:preview
      # Every review thread on the pull request is resolved.
      - "#review-threads-unresolved=0"
      # The title is a Conventional Commit (type, optional scope, optional !), because it
      # becomes the squash commit's title, which the release tool reads. The same pattern is
      # the title check in .github/workflows/pr-title.yml (test/titles.test.js keeps them equal).
      # Checked only on the pull requests we queue, not on Mergify's batch draft pull requests,
      # which merge_conditions cover.
      - "title~=^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\\([a-z0-9][a-z0-9-]*\\))?!?: [^ ]"
    # Checked on the batch draft pull request that Mergify builds on top of
    # the latest main, so every batch runs `check` again before it merges.
    merge_conditions:
      - check-success=check
    # One commit per pull request: its title and number ("feat: ... (#154)") with the
    # description as the body. Commits on main before this change keep their merge commits.
    merge_method: squash
    commit_message_format:
      title: pr-title
      body: pr-body
    batch_size: 10
    batch_max_wait_time: 1 minute
    # Pull requests whose checks are still pending after 15 minutes leave the queue.
    checks_timeout: 15 minutes
    # A failed check gets one fresh run, on a new draft pull request, before its
    # pull requests leave the queue.
    max_checks_retries: 1

merge_queue:
  # No "Queue this pull request" checkbox comment on every open pull request.
  queue_controls_comment: false

pull_request_rules:
  - name: queue a pull request labeled queue
    conditions:
      - label=queue
    actions:
      queue:

  # A pull request Catalyst opens for a ticket queues on Catalyst's own queue:ready label,
  # with no person adding `queue`. Catalyst writes that label only after it has checked for
  # a hold, and every queue condition above still applies (check, title, resolved threads,
  # not a draft, no hold or hold:preview label). It never queues a change to the files that
  # define this gate: the Mergify configuration, the workflows, Catalyst's settings, the
  # files that decide what `check` runs (test/leftover-check.sh, bunfig.toml and the
  # test/preload.js it loads, a biome or shellcheck config at any depth, a root gitleaks
  # config or ignore file, and a .env file at any depth, which bun loads into every run on
  # its own) and the files agents follow (AGENTS.md or
  # CLAUDE.md anywhere, the skills folder). A files
  # condition is true when any changed file matches, and the minus negates it; a renamed
  # file counts at both its paths. #files is GitHub's own count, so a change too big for the
  # file list cannot slip a denied file past it. Such pull requests need a person's `queue`.
  - name: queue a Catalyst pull request labeled queue:ready
    conditions:
      - author=catalyst-cloud-connector[bot]
      - label=queue:ready
      - head-repo-full-name=ryanrozich/herdr-agent-threads
      - head~=^TRD-[0-9]+$
      - base=main
      - "#files<=100"
      - -files~=^\.mergify
      - -files~=^\.github/
      - -files~=^\.catalyst/
      - -files~=^\.(claude|agents)/
      - -files~=^test/leftover-check\.sh$
      - -files~=^bunfig\.toml$
      - -files~=^test/preload\.js$
      - -files~=(^|/)(biome\.jsonc?|\.shellcheckrc)$
      - -files~=^\.gitleaks
      - -files~=(^|/)\.env
      - -files~=(^|/)(AGENTS|CLAUDE)\.md$
    actions:
      queue:
