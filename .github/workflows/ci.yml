name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml starts this on the release pull request's branch. That pull request is opened
  # with the Actions token, so its own pull_request run waits for someone to approve it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The upload step below trades the job's ID token for a short-lived Mergify token, so no
    # secret is stored. A job's own block replaces the workflow's, so contents is listed again.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Lint (Biome)
        run: bunx @biomejs/biome@2.6.4 lint

      # Biome skips a file of 1 MiB or more with a warning and exits 0: this fails instead,
      # naming the file and its size. Biome's own list of files decides which are checked. It runs
      # after a failed lint too (not after a cancel), so both results show in one run.
      - name: Linted files under Biome's size limit
        if: success() || failure()
        run: sh test/lint-size.sh

      - name: Shell scripts (shellcheck)
        run: shellcheck -S warning $(git ls-files '*.sh')

      - name: Extractor syntax (jq)
        run: for f in mods/*/core/extract*.jq; do echo '"x"' | jq -R -f "$f" > /dev/null; done

      # bun test through the leftover check: it fails when the run leaves a file in its temp
      # folder or a process running. The same run also writes a JUnit report for the upload
      # below; what it prints stays the same.
      - name: Tests, leaving nothing behind
        id: tests
        run: |
          command -v sqlite3 || { sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3; }
          sh test/leftover-check.sh --reporter=junit --reporter-outfile=junit.xml

      # Sends the report to Mergify Test Engine, also when the tests failed. Skipped when no
      # report was written, and on a pull request from a fork, which gets no ID token.
      - name: Test results to Mergify
        if: (success() || failure()) && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles('junit.xml') != ''
        uses: mergifyio/gha-mergify-ci@v30
        with:
          report_path: junit.xml
          test_step_outcome: ${{ steps.tests.outcome }}

      # The commits this push or pull request adds. A full-history scan is a one-time manual pass.
      - name: Secrets in new commits (gitleaks)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then range="-1 $HEAD"; else range="$BASE..$HEAD"; fi
          ./gitleaks git --redact --no-banner --log-opts="$range" .
