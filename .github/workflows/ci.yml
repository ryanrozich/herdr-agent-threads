name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Lint (Biome)
        run: bunx @biomejs/biome@2.6.4 lint

      - name: Shell scripts (shellcheck)
        run: shellcheck -S warning $(git ls-files '*.sh')

      - name: Extractor syntax (jq)
        run: for f in mods/*/extract*.jq; do echo '"x"' | jq -R -f "$f" > /dev/null; done

      - name: Tests
        run: |
          command -v sqlite3 || { sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3; }
          bun test

      # The commits this push or pull request adds. A full-history scan is a one-time manual pass.
      - name: Secrets in new commits (gitleaks)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then range="-1 $HEAD"; else range="$BASE..$HEAD"; fi
          ./gitleaks git --redact --no-banner --log-opts="$range" .
