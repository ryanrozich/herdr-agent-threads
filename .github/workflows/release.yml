name: Release

# release-please keeps one release pull request open with the next version and its changelog
# entry, built from the Conventional Commit titles merged since the last release. Merging it
# through the queue (label queue) makes the tag (v1.0.1) and the GitHub release on the next
# run. The pieces: release-please-config.json, .release-please-manifest.json, CHANGELOG.md,
# and mods/agent-threads/version.js, the version the settings card shows.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: release
        uses: googleapis/release-please-action@v4

      # A pull request opened with the Actions token starts no workflow run, so the release
      # pull request would never get the `check` the queue waits for. A dispatch with that
      # token does start one, so this runs ci.yml on the release branch, and its `check` lands
      # on the branch's head, which is the release pull request's head.
      - name: Run CI on the release pull request
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          echo "Started ci.yml on $BRANCH"
