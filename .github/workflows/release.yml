name: Release

# release-please keeps one release pull request open with the next version and its changelog
# entry, built from the Conventional Commit titles merged since the last release. Merging it
# through the queue (label queue) makes the tag (v1.0.1) and the GitHub release on the next
# run. The pieces: release-please-config.json, .release-please-manifest.json, CHANGELOG.md,
# and mods/agent-threads/version.js, the version the settings card shows.
# Merging to main does not release: it only updates that pull request, which stays open
# between releases. It opens as a draft, which the queue refuses, and is marked ready and
# merged only when the repo's owner asks for a release.
on:
  push:
    branches: [main]
  workflow_dispatch:

# contents, issues and pull-requests are the three the action's README asks for (it labels
# its pull request "autorelease: pending"); actions lets the step below start ci.yml.
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1

      # A pull request the Actions token opens or updates gets its pull_request runs only in
      # an approval-required state: they wait until someone with write access approves them,
      # so the queue's `check` would wait too. A dispatch with that token runs at once, so this
      # runs ci.yml on the release branch, and its `check` lands on the branch's head, which is
      # the release pull request's head.
      - name: Run CI on the release pull request
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          echo "Started ci.yml on $BRANCH"
