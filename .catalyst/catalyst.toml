[project]
linear_team = "TRD"

[project.linear.states]
dispatch = "Todo"
intake = "Intake"
research = "Research"
plan = "Plan"
implement = "Implement"
remediate = "Remediate"
verify = "Validate"
review = "Validate"
pr = "PR"
done = "Done"
canceled = "Canceled"

[merge]
policy = "checks-and-threads"
queue = "mergify"
required_checks = ["check"]

[environment]
toolchains = [{ name = "bun", version = "1.4.2" }]

[[environment.system_packages]]
name = "gitleaks"

[[environment.system_packages]]
name = "jq"

[[environment.system_packages]]
name = "lsof"

[[environment.system_packages]]
name = "perl"

[[environment.system_packages]]
name = "procps"

[[environment.system_packages]]
name = "rsync"

[[environment.system_packages]]
name = "shellcheck"

[[environment.system_packages]]
name = "sqlite3"

[[environment.system_packages]]
name = "tesseract-ocr"

# A virtual display and the libraries the Herdr app loads, for test/herdr-still.sh. The app
# loads libxkbcommon-x11 at run time, so ldd does not list it.
[[environment.system_packages]]
name = "xvfb"

[[environment.system_packages]]
name = "libgl1"

[[environment.system_packages]]
name = "libegl1"

[[environment.system_packages]]
name = "libgl1-mesa-dri"

[[environment.system_packages]]
name = "mesa-vulkan-drivers"

[[environment.system_packages]]
name = "fonts-dejavu-core"

[[environment.system_packages]]
name = "libxkbcommon0"

[[environment.system_packages]]
name = "libxkbcommon-x11-0"

# The official Herdr build for Linux, as this user, into ~/.cache/herdr-rig, for
# test/herdr-still.sh. It never fails the phase: when it cannot install, the script says so.
# The display is started only inside that script, never here.
[[environment.setup]]
name = "install-herdr"
run = ["sh", "-c", "mkdir -p \"$HOME/.cache/herdr-rig\" && curl -fsSL https://releases.herdr.dev/app/install.sh | env -u XDG_DATA_HOME HOME=\"$HOME/.cache/herdr-rig\" sh >&2 || echo 'install-herdr: Herdr did not install, so test/herdr-still.sh cannot take a still' >&2"]
timeout_seconds = 300

[[environment.verify]]
name = "lint"
run = ["bunx", "@biomejs/biome@2.6.4", "lint"]

[[environment.verify]]
name = "shellcheck"
run = ["sh", "-ec", "git ls-files -z '*.sh' | xargs -0 shellcheck -S warning"]

[[environment.verify]]
name = "extractor-syntax"
run = ["sh", "-ec", "for f in mods/*/core/extract*.jq; do echo '\"x\"' | jq -R -f \"$f\" > /dev/null; done"]

[[environment.verify]]
name = "tests"
run = ["sh", "test/leftover-check.sh"]
timeout_seconds = 600

[environment.container]
egress = ["releases.herdr.dev"]

[thoughts]
repo_owner = "ryanrozich"
repo_name = "thoughts"
default_branch = "main"
repos_subdir = "repos"
directory = "herdr-agent-threads"
